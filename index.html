<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban Board</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="style/style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="container">
        <span class="navbar-brand">
          <i class="bi bi-kanban"></i>
          Kanban
        </span>
        <button
          class="add-btn"
          data-bs-toggle="modal"
          data-bs-target="#addTaskModal"
        >
          +
        </button>
      </div>
    </nav>

    <div class="kanban-container container">
      <div class="kanban-column">
        <div class="column-header">
          <div class="column-icon todo">
            <i class="bi bi-clipboard"></i>
          </div>
          <h3 class="column-title">To Do</h3>
          <span class="task-count"><span id="todo-count"> 0 </span> task</span>
        </div>
        <div id="todo-container"></div>
      </div>

      <div class="kanban-column">
        <div class="column-header">
          <div class="column-icon progress">
            <i class="bi bi-hourglass-split"></i>
          </div>
          <h3 class="column-title">In Progress</h3>
          <span class="task-count"
            ><span id="progress-count"> 0</span> tasks</span
          >
        </div>
        <div id="progress-container"></div>
      </div>

      <div class="kanban-column">
        <div class="column-header">
          <div class="column-icon completed">
            <i class="bi bi-check-circle"></i>
          </div>
          <h3 class="column-title">Completed</h3>
          <span class="task-count"
            ><span id="completed-count"> 0 </span> tasks</span
          >
        </div>
        <div id="completed-container"></div>
      </div>
    </div>

    <div
      class="modal fade"
      id="addTaskModal"
      tabindex="-1"
      aria-labelledby="addTaskModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="addTaskModalLabel">Add New Task</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form id="addTaskForm">
              <div class="mb-3">
                <label for="taskTitle" class="form-label">Task Title</label>
                <input
                  type="text"
                  class="form-control"
                  id="taskTitle"
                  placeholder="Enter task title"
                  minlength="3"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="taskPriority" class="form-label">Priority</label>
                <select class="form-select" id="taskPriority" required>
                  <option value="High">High Priority</option>
                  <option value="Medium" selected>Medium Priority</option>
                  <option value="Low">Low Priority</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="taskDueDate" class="form-label">Due Date</label>
                <input
                  type="date"
                  class="form-control"
                  id="taskDueDate"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="taskDescription" class="form-label"
                  >Description (Optional)</label
                >
                <textarea
                  class="form-control"
                  id="taskDescription"
                  rows="3"
                  placeholder="Enter task description"
                ></textarea>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancel
            </button>
            <button type="button" class="btn btn-primary" id="addTaskBtn">
              Add Task
            </button>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script src="scripts/index.js" type="module"></script>
  </body>
</html>
